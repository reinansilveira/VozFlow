# Publicação do site de vendas no Netlify.
# O domínio usado nas URLs canônicas, no sitemap e no robots.txt vem de SITE_URL
# ou, sem ela, do endereço principal do site no Netlify.

[build]
  command = "npm run site:build"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "20"

# Arquivos gerados com hash no nome: podem ficar em cache para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
